name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # =============================================================
  # Job 1: CI - Test & Verification
  # =============================================================
  test:
    name: 🧪 Run Tests & Model Verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install OpenCV System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: 🔍 Syntax & Compilation Check
        run: |
          python -m py_compile app.py gradio_app.py

      - name: 🧠 Test YOLO Model Loading & Inference
        run: |
          python -c "
          from pathlib import Path
          from PIL import Image
          from ultralytics import YOLO
          import gradio_app

          print('[*] Testing weights & model...')
          weights = gradio_app.ensure_model_weights(Path('models/best.pt'))
          model = YOLO(str(weights))
          print(f'[✓] Loaded Model Classes: {model.names}')

          print('[*] Testing image inference...')
          img = Image.open('test_images/sample.jpg')
          annotated, status, df = gradio_app.detect_image(img, 0.40)
          print(f'[✓] Inference result: {status}')
          print('[✓] All CI verification checks passed!')
          "

  # =============================================================
  # Job 2: CD - Docker Image Build & Verification
  # =============================================================
  docker:
    name: 🐳 Build & Test Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: weapon-detection-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
